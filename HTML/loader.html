        *{

         body{
            background-color: #581368;
         }
        .asd{
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 10px solid #8c00ff;
            border-top: 10px solid #f3f3f3;
            animation: spin 2s linear infinite;
            padding-top: 0px;
        }
        @keyframes spin{
            0%{
                transform: rotate(0deg);
            }
            100%{
                transform: rotate(360deg);
        }}

    </style>
</head>
<body>
    <div class="asd">

    </div>
