<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CARASOUL</title>
    <style>
        html{
            font-size: 62.5%;
        }
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            height:100vh;
        display: grid; 
    place-items: center;       
}
.container{
    width: 60vw;
    height: 50rem;
    border-radius: 2%;
    box-shadow: rgba(0, 0, 0, 0.3) 0px 19px 38px, rgba(0, 0, 0, 0.22) 0px 15px 12px;
    animation: gallery 20s linear infinite;
    background-size: cover;
}
@keyframes gallery{
    0%{
        background-image: url('https://images.unsplash.com/photo-1506748686214-e9df14d4d9d0?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixid=MnwzNjUyOXwwfDF8c2VhcmNofDJ8fGNhcm91c2V8ZW58MHx8fHwxNjg5NTY1NzQy&ixlib=rb-4.0.3&q=80&w=1080'); 
    }
    20%{
        background-image: url("https://upload.wikimedia.org/wikipedia/commons/b/b6/Image_created_with_a_mobile_phone.png"); 
    }
    40%{
        background-image: url("https://wallpapercave.com/wp/wp15410704.jpg"); 
    }
    60%{
        background-image: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ8QJO1kt1DL2CH6n4REcfPrdSF9gPT_1egZg&s'); 
    }
    80%{
        background-image: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ8QJO1kt1DL2CH6n4REcfPrdSF9gPT_1egZg&s'); 
    }
    100%{
        background-image: url('https://wallpapercave.com/wp/wp15410704.jpg'); 
    }
}
    </style>
</head> 
<body>
    <div class="container"></div>
</body>
</html>
