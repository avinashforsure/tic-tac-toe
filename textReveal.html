<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            
            background-color: black;
        }
        h1{
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 50px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 5px;
            position: relative;
            text-align: center; ;
        }
        h1::before{
            content: 'AVINASH';
            position: absolute;
            
           
            color: yellow;
            top: 0;
            left: 0;
            width: 100%;
            border-right: 2px solid yellow;
            overflow:hidden;
            animation: text .5s linear infinite alternate;
        }
        @keyframes text{
            0%{
                width: 0;
            }
            100%{
                width: 100  ;
            }
        }
    </style>
    <h1>AVINASH</h1>
</head>
